<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>送信完了 | サカイデザインアトリエ</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Sans+JP:wght@100;300;400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="thanks.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="index.html" class="logo-wrap">
      <img src="ロゴ-01.png" alt="サカイデザインアトリエ ロゴ" class="logo-img">
    </a>
    <button class="hamburger" id="hamburger" aria-label="メニューを開く">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- NAV（デスクトップ） -->
  <nav id="global-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="#">Works</a>
    <a href="#">Service</a>
    <a href="#">Flow</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- ドロワー（スマホ） -->
  <div class="drawer" id="drawer">
    <button class="drawer-close" id="drawer-close" aria-label="閉じる">&#x2715;</button>
    <nav class="drawer-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="#">Works</a>
      <a href="#">Service</a>
      <a href="#">Flow</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- MAIN -->
  <main>
    <div class="thanks-card">

      <!-- メガネアイコン -->
      <div class="icon-wrap">
        <img src="ロゴ-2.png" alt="" class="glasses-img">
      </div>

      <h1 class="thanks-title">
        お問い合わせありがとうございます。
      </h1>
      <p class="thanks-body">
        <!--確認のため、自動返信メールをお送りいたします。<br>-->
        内容を確認次第、改めてご連絡いたします。
      </p>

      <a href="index.html" class="back-btn">Home</a>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-logo">サカイデザインアトリエ</div>
    <div class="footer-copy">&copy; 2026 サカイデザインアトリエ &nbsp;|&nbsp; sakai.mitsuki.design@gmail.com</div>
  </footer>

  <script>
    // ハンバーガーメニュー
    const hamburger = document.getElementById('hamburger');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('drawer-overlay');
    const closeBtn = document.getElementById('drawer-close');
    function openDrawer() { drawer.classList.add('open'); overlay.classList.add('open'); }
    function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('open'); }
    hamburger.addEventListener('click', openDrawer);
    closeBtn.addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);
  </script>

</body>
</html>
